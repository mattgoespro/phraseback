[package]
name = "flow-engine"
version.workspace = true
edition.workspace = true

[[bin]]
name = "phraseback-engine"
path = "src/main.rs"

[dependencies]
flow-core = { path = "../flow-core" }
flow-capture-windows = { path = "../flow-capture-windows" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
fs2.workspace = true
png.workspace = true
chrono.workspace = true
tempfile.workspace = true
image.workspace = true
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "=1.48.0", features = ["rt", "time", "macros"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp"] }
