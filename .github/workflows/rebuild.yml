name: Phraseback verification
on:
  push:
    paths: ['packages/**', 'packaging/**', 'scripts/**', '.cargo/**', 'build.ps1', '.gitattributes', '.github/workflows/rebuild.yml']
  pull_request:
    paths: ['packages/**', 'packaging/**', 'scripts/**', '.cargo/**', 'build.ps1', '.gitattributes', '.github/workflows/rebuild.yml']
  workflow_dispatch:
    inputs:
      run_portable:
        description: 'Also run optional Linux/macOS shared-component checks'
        type: boolean
        default: false
      run_endurance:
        description: 'Run optional synthetic recording and encoder heap checks'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.run_portable && '["windows-latest","ubuntu-latest","macos-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.tmp/rebuild/target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: packages/ui/package-lock.json
      - name: Install locked UI dependencies
        run: npm ci --prefix packages/ui
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tmp/rebuild/target
          key: ${{ runner.os }}-rust-1.98.1-${{ hashFiles('packages/engine/Cargo.lock', '.cargo/config.toml') }}
      - name: Verify generated contracts and TypeScript
        run: npm run check --prefix packages/ui
      - name: Rust checks
        working-directory: packages/engine
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked
      - name: Select real test engine and install isolated fixture
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          "PHRASEBACK_TEST_ENGINE=$env:CARGO_TARGET_DIR/debug/phraseback-engine$suffix" >> $env:GITHUB_ENV
          ./scripts/electron_fixture.ps1
      - name: Electron unit and real-engine contract tests
        run: npm test --prefix packages/ui

  windows-package:
    needs: [contracts]
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: packages/ui/package-lock.json
      - run: npm ci --prefix packages/ui
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tmp/rebuild/target
          key: windows-package-rust-1.98.1-${{ hashFiles('packages/engine/Cargo.lock', '.cargo/config.toml') }}
      - name: Install verified Inno compiler on disposable runner
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Get-Content packaging/inno.lock.json -Raw | ConvertFrom-Json
          $toolRoot = Join-Path $env:GITHUB_WORKSPACE '.tmp/tooling'
          New-Item -ItemType Directory -Force $toolRoot | Out-Null
          $setup = Join-Path $toolRoot 'inno-setup.exe'
          Invoke-WebRequest -Uri $pin.installer_url -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne $pin.installer_sha256) { throw 'Inno installer hash mismatch' }
          $signature = Get-AuthenticodeSignature $setup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike "*O=$($pin.publisher),*") { throw 'Inno publisher verification failed' }
          $destination = Join-Path $toolRoot "inno-$($pin.version)"
          $process = Start-Process -FilePath $setup -ArgumentList @('/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/NOICONS',('/DIR="' + $destination + '"')) -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill($true); throw 'Inno setup timed out' }
          if ($process.ExitCode -ne 0) { throw "Inno setup failed: $($process.ExitCode)" }
      - uses: actions/cache@v4
        with:
          path: .tmp/rebuild/dependencies/ffmpeg-minimal
          key: windows-minimal-encoder-${{ hashFiles('packaging/ffmpeg.lock.json', 'packaging/ffmpeg-source.lock.json', 'scripts/build_minimal_ffmpeg.sh') }}
      - name: Verify encoder source kit and acquisition
        run: |
          ./scripts/rebuild_ffmpeg.ps1
          ./scripts/test_rebuild_ffmpeg.ps1
          ./scripts/test_rebuild_ffmpeg_source.ps1
      - name: Build Electron portable folder and per-user installer
        run: |
          ./scripts/electron_candidate.ps1
          $candidate = (Get-Content .tmp/electron/latest-candidate.json -Raw | ConvertFrom-Json).candidate
          ./scripts/electron_verify_candidate.ps1 -Candidate $candidate
      - name: Verify release startup and handshake-before-write policy
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.tmp/rebuild/target
        run: cargo +1.98.1-x86_64-pc-windows-msvc test --manifest-path packages/engine/Cargo.toml --locked --release --target x86_64-pc-windows-msvc -p flow-engine --test startup
      - name: Optional synthetic recording endurance
        if: github.event_name == 'workflow_dispatch' && inputs.run_endurance
        run: ./scripts/rebuild_endurance_check.ps1
      - name: Optional encoder heap accounting
        if: github.event_name == 'workflow_dispatch' && inputs.run_endurance
        run: ./scripts/rebuild_encoder_memory.ps1
      # A hosted build does not establish native desktop acceptance or authorize release.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-package-provenance
          path: |
            .tmp/electron/package-*/build-provenance.json
            .tmp/electron/package-*/package-summary.json
            .tmp/electron/package-*/Phraseback-win32-x64/licenses/cargo/components.json
            .tmp/electron/package-*/Phraseback-win32-x64/licenses/npm/components.json
            .tmp/rebuild/endurance-*/*.json
            .tmp/rebuild/endurance-*/*.log
            .tmp/rebuild/encoder-memory-*/*.json
          if-no-files-found: warn
